[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precompress"
version = "0.1.0"
description = "PreCompress: LLMLingua-2 pre-compression + LLM fact extraction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "llmlingua>=0.2.2",
  "transformers>=4.36.0",
  "openai>=1.10.0",
  "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["precompress*"]
exclude = ["tests*", "examples*"]
